<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Status Tiket - KUTUB 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">KUTUB 2026</a>
    <a href="index.html">Beranda</a>
  </div>
</header>

<main class="container section">
  <section class="panel ticket-detail">
    <div class="eyebrow">Status pemesanan</div>
    <h1>Tiket Kamu</h1>
    <p id="statusMessage" class="notice">Memeriksa status pesanan...</p>
    <div id="ticketContent"></div>

    <div class="form-actions" style="margin-top:20px">
      <button type="button" onclick="loadOrder()" class="btn-muted">
        Perbarui Status
      </button>
      <a class="btn btn-light" href="index.html">Kembali ke Beranda</a>
    </div>
  </section>
</main>

<footer class="footer">Pentas Tunggal KUTUB 2026</footer>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzSA37cDKyVluKWG-rbzTR5IkfhLDfTLAkxCO_2KvX31vS7g1QUTZVu_EIiGzW37tLT/exec';
const orderId = new URLSearchParams(location.search).get('orderId');

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

async function loadOrder() {
  const message = document.getElementById('statusMessage');
  const content = document.getElementById('ticketContent');

  if (!orderId) {
    message.className = 'error';
    message.textContent =
      'Order ID tidak ditemukan. Buka halaman ini dari tautan setelah pemesanan.';
    return;
  }

  message.className = 'notice';
  message.textContent = 'Memeriksa status pesanan...';

  try {
    const response = await fetch(API + '?' + new URLSearchParams({
      action: 'checkOrder',
      orderId: orderId
    }));

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || 'Pesanan tidak ditemukan.');
    }

    if (data.Status === 'Verified') {
      message.className = 'success';
      message.textContent = data.Digunakan === 'Sudah'
        ? 'Tiket ini sudah digunakan untuk check-in.'
        : 'Pembayaran terverifikasi! Tiket kamu sudah aktif.';

      content.innerHTML = `
        <h2>Detail Tiket</h2>
        <p><strong>Nama:</strong> ${esc(data.Nama)}</p>
        <p><strong>Order ID:</strong></p>
        <div class="ticket-code">${esc(data.OrderID)}</div>
        <p><strong>Ticket ID:</strong></p>
        <div class="ticket-code">${esc(data.TicketID || 'Belum tersedia')}</div>
        <p><strong>Jenis tiket:</strong> ${esc(data.JenisTiket)}</p>
        <p><strong>Jumlah:</strong> ${esc(data.Jumlah)}</p>
        <p><strong>Status:</strong> ${esc(data.Status)}</p>
        <p><strong>Check-in:</strong> ${esc(data.Digunakan || 'Belum')}</p>

        ${data.QRUrl ? `
          <img class="qr-ticket" src="${esc(data.QRUrl)}" alt="QR Code tiket">
          <p class="muted" style="text-align:center">
            Tunjukkan QR code ini kepada panitia saat check-in.
          </p>
        ` : ''}
      `;
    } else {
      message.className = 'notice';
      message.textContent =
        'Pesanan diterima dan sedang menunggu verifikasi pembayaran.';

      content.innerHTML = `
        <h2>Detail Pesanan</h2>
        <p><strong>Nama:</strong> ${esc(data.Nama)}</p>
        <p><strong>Order ID:</strong></p>
        <div class="ticket-code">${esc(data.OrderID)}</div>
        <p><strong>Jenis tiket:</strong> ${esc(data.JenisTiket)}</p>
        <p><strong>Jumlah:</strong> ${esc(data.Jumlah)}</p>
        <p><strong>Status:</strong> ${esc(data.Status)}</p>
        <p class="muted">
          QR tiket akan tersedia setelah pembayaran diverifikasi panitia.
        </p>
      `;
    }
  } catch (error) {
    message.className = 'error';
    message.textContent = error.message;
  }
}

loadOrder();
</script>
</body>
</html>
