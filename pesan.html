
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesan Tiket - KUTUB 2026</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{min-height:100vh;padding:22px 14px}
    .panel{max-width:620px;margin:20px auto;padding:24px;background:#ffffffed;border-radius:20px;box-shadow:0 8px 30px #321c2420}
    h1,h2{color:#53161f}
    .field{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:10px}
    .btn{width:100%;padding:13px;border:0;border-radius:10px;background:#53161f;color:white;cursor:pointer;font-size:16px}
    .muted{color:#776970;font-size:13px}
    .pricebox{padding:14px;border-radius:12px;background:#f8edf0;margin:10px 0 18px}
    .pricebox strong{color:#53161f;font-size:20px}
    #qrisImage{max-width:100%;max-height:280px;object-fit:contain}
    .center{text-align:center}
  </style>
</head>
<body class="bg-pesan">
  <main class="panel">
    <a href="index.html">← Kembali ke halaman utama</a>
    <h1>Pesan Tiket</h1>
    <p>Isi data dengan benar dan unggah bukti pembayaran untuk menyelesaikan pemesanan.</p>

    <form id="orderForm">
      <label for="nama">Nama lengkap</label>
      <input class="field" id="nama" name="nama" required maxlength="100">

      <label for="nohp">Nomor HP</label>
      <input class="field" id="nohp" name="nohp" type="tel" required maxlength="25">

      <label for="email">Email</label>
      <input class="field" id="email" name="email" type="email" required maxlength="150">

      <label for="jenisTiket">Jenis tiket</label>
      <select class="field" id="jenisTiket" name="jenisTiket" required>
        <option value="">Memuat jenis tiket...</option>
      </select>

      <label for="jumlah">Jumlah tiket</label>
      <input class="field" id="jumlah" name="jumlah" type="number" min="1" max="20" value="1" required>

      <div class="pricebox">
        Harga per tiket: <strong id="unitPrice">—</strong><br>
        Total pembayaran: <strong id="totalPrice">—</strong>
      </div>

      <h2>QRIS Pembayaran</h2>
      <div class="center" id="qrisContainer">
        <p class="muted">Memuat QRIS...</p>
      </div>

      <label for="bukti">Unggah bukti pembayaran (JPG, PNG, WEBP; maksimal 4 MB)</label>
      <input class="field" id="bukti" name="bukti" type="file" accept="image/jpeg,image/png,image/webp" required>

      <button class="btn" id="submitBtn" type="submit">Kirim Pemesanan</button>
      <p class="muted" id="formMessage"></p>
    </form>
  </main>

<script>
const API='https://script.google.com/macros/s/AKfycbzSA37cDKyVluKWG-rbzTR5IkfhLDfTLAkxCO_2KvX31vS7g1QUTZVu_EIiGzW37tLT/exec';
let ticketTypes=[];

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0);}
async function get(action){
  const r=await fetch(API+'?action='+encodeURIComponent(action));
  return r.json();
}
async function post(data){
  const r=await fetch(API,{method:'POST',body:JSON.stringify(data)});
  return r.json();
}
function selectedType(){
  return ticketTypes.find(t=>t.nama===document.getElementById('jenisTiket').value);
}
function updateTotal(){
  const type=selectedType();
  const quantity=Number(document.getElementById('jumlah').value)||0;
  document.getElementById('unitPrice').textContent=type?money(type.harga):'—';
  document.getElementById('totalPrice').textContent=type?money(type.harga*quantity):'—';
}
async function loadTicketTypes(){
  const select=document.getElementById('jenisTiket');
  const requested=new URLSearchParams(location.search).get('jenis');
  const result=await get('getTicketTypes');
  if(!result.success)throw new Error(result.error||'Gagal mengambil jenis tiket.');

  ticketTypes=result.ticketTypes||[];
  if(!ticketTypes.length){
    select.innerHTML='<option value="">Belum ada tiket yang dijual</option>';
    document.getElementById('submitBtn').disabled=true;
    document.getElementById('formMessage').textContent='Belum ada jenis tiket aktif. Silakan kembali lagi nanti.';
    updateTotal();
    return;
  }

  select.innerHTML='<option value="">Pilih jenis tiket</option>'+ticketTypes.map(t=>
    `<option value="${esc(t.nama)}">${esc(t.nama)} — ${money(t.harga)}</option>`
  ).join('');

  if(requested&&ticketTypes.some(t=>t.nama===requested))select.value=requested;
  updateTotal();
}
async function loadQris(){
  const container=document.getElementById('qrisContainer');
  try{
    const result=await get('getQris');
    if(!result.success||!result.url)throw new Error(result.error||'QRIS belum tersedia.');
    container.innerHTML=`<img id="qrisImage" src="${esc(result.url)}" alt="QRIS pembayaran"><p class="muted">Pindai QRIS untuk membayar sesuai total pemesanan.</p>`;
  }catch(error){
    container.innerHTML='<p class="muted">QRIS belum dapat ditampilkan. Silakan hubungi panitia.</p>';
  }
}
function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(new Error('Gagal membaca file bukti pembayaran.'));
    reader.readAsDataURL(file);
  });
}

document.getElementById('jenisTiket').addEventListener('change',updateTotal);
document.getElementById('jumlah').addEventListener('input',updateTotal);

document.getElementById('orderForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('formMessage');
  const button=document.getElementById('submitBtn');
  const file=document.getElementById('bukti').files[0];
  const type=selectedType();
  const jumlah=Number(document.getElementById('jumlah').value);

  if(!type){msg.textContent='Silakan pilih jenis tiket yang tersedia.';return;}
  if(!Number.isInteger(jumlah)||jumlah<1||jumlah>20){msg.textContent='Jumlah tiket harus antara 1 sampai 20.';return;}
  if(!file){msg.textContent='Silakan unggah bukti pembayaran.';return;}
  if(file.size>4*1024*1024){msg.textContent='Ukuran file maksimal 4 MB.';return;}
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){msg.textContent='Format file harus JPG, PNG, atau WEBP.';return;}

  button.disabled=true;
  msg.textContent='Mengirim pemesanan...';

  try{
    const dataUrl=await fileToDataUrl(file);
    const result=await post({
      action:'order',
      nama:document.getElementById('nama').value.trim(),
      nohp:document.getElementById('nohp').value.trim(),
      email:document.getElementById('email').value.trim(),
      jenisTiket:type.nama,
      jumlah,
      buktiBase64:dataUrl.split(',')[1],
      buktiMime:file.type
    });

    if(!result.success)throw new Error(result.error||'Pemesanan gagal.');
    msg.textContent='Pemesanan berhasil dikirim. Mengalihkan ke halaman tiket...';
    location.href='tiket.html?orderId='+encodeURIComponent(result.orderId);
  }catch(error){
    msg.textContent=error.message||'Terjadi kesalahan. Silakan coba lagi.';
    button.disabled=false;
  }
});

(async()=>{
  try{await loadTicketTypes();}
  catch(error){
    document.getElementById('jenisTiket').innerHTML='<option value="">Gagal memuat tiket</option>';
    document.getElementById('formMessage').textContent=error.message;
    document.getElementById('submitBtn').disabled=true;
  }
  loadQris();
})();
</script>
</body>
</html>
