
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuota Tiket - KUTUB 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-admin">
  <main class="panel">
    <a href="admin.html" class="back-link">← Kembali ke Dashboard</a>
    <h1>Kuota Tiket</h1>
    <p class="muted">Pantau jumlah tiket yang dipesan, terverifikasi, dan tersisa.</p>

    <div id="summary" class="summary-grid">
      <article class="summary-card">
        <span>Total Kuota</span>
        <strong>—</strong>
      </article>
      <article class="summary-card">
        <span>Sudah Dipesan</span>
        <strong>—</strong>
      </article>
      <article class="summary-card">
        <span>Sisa Kuota</span>
        <strong>—</strong>
      </article>
    </div>

    <div class="table-wrap">
      <table class="ticket-table">
        <thead>
          <tr>
            <th>Jenis Tiket</th>
            <th>Harga</th>
            <th>Kuota</th>
            <th>Dipesan</th>
            <th>Terverifikasi</th>
            <th>Sisa</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="typesBody">
          <tr><td colspan="7">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>

    <p id="message" class="status-msg" aria-live="polite"></p>
    <button class="btn" id="refreshBtn" type="button">Muat Ulang</button>
  </main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzSA37cDKyVluKWG-rbzTR5IkfhLDfTLAkxCO_2KvX31vS7g1QUTZVu_EIiGzW37tLT/exec';
const pin = sessionStorage.getItem('adminPin') || '';
const role = sessionStorage.getItem('adminRole') || '';

const body = document.getElementById('typesBody');
const message = document.getElementById('message');

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function money(value) {
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
}

async function loadTypes() {
  body.innerHTML = '<tr><td colspan="7">Memuat data...</td></tr>';
  message.textContent = '';

  try {
    const response = await fetch(API + '?action=getTicketStatus');
    if (!response.ok) throw new Error('Server tidak merespons.');

    const data = await response.json();
    if (!data.success) throw new Error(data.error || 'Gagal mengambil data kuota.');

    const types = Array.isArray(data.ticketTypes) ? data.ticketTypes : [];
    const availableNames = new Set(
      (Array.isArray(data.available) ? data.available : []).map(t => t.nama)
    );

    if (!types.length) {
      body.innerHTML = '<tr><td colspan="7">Data kuota belum tersedia.</td></tr>';
      return;
    }

    body.innerHTML = types.map(t => {
      const quota = Number(t.kuota) || 0;
      const ordered = Number(t.dipesan) || 0;
      const verified = Number(t.terverifikasi) || 0;
      const remaining = Number(t.sisa) || 0;
      const available = availableNames.has(t.nama);
      const status = remaining <= 0 ? 'Habis' : available ? 'Dijual' : 'Menunggu giliran';

      return `<tr>
        <td>${esc(t.nama)}</td>
        <td>${money(t.harga)}</td>
        <td>${quota}</td>
        <td>${ordered}</td>
        <td>${verified}</td>
        <td>${remaining}</td>
        <td><span class="status-pill">${status}</span></td>
      </tr>`;
    }).join('');

    const totalQuota = types.reduce((sum, t) => sum + (Number(t.kuota) || 0), 0);
    const totalOrdered = types.reduce((sum, t) => sum + (Number(t.dipesan) || 0), 0);
    const totalRemaining = types.reduce((sum, t) => sum + (Number(t.sisa) || 0), 0);

    document.getElementById('summary').innerHTML = `
      <article class="summary-card"><span>Total Kuota</span><strong>${totalQuota}</strong></article>
      <article class="summary-card"><span>Sudah Dipesan</span><strong>${totalOrdered}</strong></article>
      <article class="summary-card"><span>Sisa Kuota</span><strong>${totalRemaining}</strong></article>`;

    message.textContent = 'Data berhasil diperbarui.';
  } catch (error) {
    body.innerHTML = `<tr><td colspan="7">${esc(error.message)}</td></tr>`;
    message.textContent = 'Periksa koneksi dan konfigurasi Google Apps Script.';
  }
}

if (!pin || role !== 'super') {
  document.querySelector('.panel').innerHTML = `
    <h1>Akses Ditolak</h1>
    <p>Halaman ini hanya dapat dibuka oleh admin super.</p>
    <a href="admin.html">Kembali ke login admin</a>`;
} else {
  loadTypes();
  document.getElementById('refreshBtn').addEventListener('click', loadTypes);
}
</script>
</body>
</html>
