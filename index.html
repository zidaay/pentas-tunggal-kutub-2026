
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pentas Tunggal KUTUB 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-home">
  <main class="content">
    <header class="hero">
      <span class="eyebrow">PENTAS TUNGGAL</span>
      <h1>KUTUB 2026</h1>
      <p class="muted">Satu panggung, banyak cerita. Amankan tiketmu sebelum kehabisan!</p>
    </header>

    <section aria-labelledby="ticketHeading">
      <h2 id="ticketHeading">Tiket yang Sedang Dijual</h2>
      <p class="muted">Early Bird, Presale, dan Reguler dibuka secara berurutan. Bundle dijual terpisah.</p>

      <div class="ticket-grid" id="ticketGrid">
        <p class="muted">Memuat ketersediaan tiket...</p>
      </div>
      <p class="status-msg" id="statusMessage" aria-live="polite"></p>
    </section>

    <footer class="page-footer">
      <p>© KUTUB 2026</p>
      <a href="admin.html">Halaman Admin</a>
    </footer>
  </main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzSA37cDKyVluKWG-rbzTR5IkfhLDfTLAkxCO_2KvX31vS7g1QUTZVu_EIiGzW37tLT/exec';

const grid = document.getElementById('ticketGrid');
const message = document.getElementById('statusMessage');

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[char]);
}

function money(value) {
  return new Intl.NumberFormat('id-ID', {
    style: 'currency',
    currency: 'IDR',
    maximumFractionDigits: 0
  }).format(Number(value) || 0);
}

async function loadTickets() {
  grid.innerHTML = '<p class="muted">Memuat ketersediaan tiket...</p>';
  message.textContent = '';

  try {
    const response = await fetch(API + '?action=getTicketStatus');
    if (!response.ok) throw new Error('Server tiket tidak merespons.');

    const result = await response.json();
    if (!result.success) throw new Error(result.error || 'Gagal memuat tiket.');

    const available = Array.isArray(result.available) ? result.available : [];

    if (available.length === 0) {
      grid.innerHTML = `
        <article class="ticket-card sold-out">
          <h2>Tiket Habis</h2>
          <p>Terima kasih atas antusiasmenya!</p>
        </article>`;
      message.textContent = 'Saat ini tidak ada tiket yang tersedia.';
      return;
    }

    grid.innerHTML = available.map(ticket => {
      const isBundle = ticket.nama === 'Bundle';
      const stock = Math.max(0, Number(ticket.sisa) || 0);
      const quota = Number(ticket.kuota) || 0;

      return `
        <article class="ticket-card ${isBundle ? 'bundle' : ''}">
          <span class="badge">${isBundle ? 'BUNDLE' : 'TAHAP TIKET'}</span>
          <h2>${esc(ticket.nama)}</h2>
          <p class="price">${money(ticket.harga)}</p>
          <p class="stock">
            Sisa kuota: <strong>${stock}</strong> dari ${quota}
            ${isBundle ? 'paket' : 'kursi'}
          </p>
          <a class="btn" href="pesan.html?jenis=${encodeURIComponent(ticket.nama)}">
            Pesan Sekarang
          </a>
        </article>`;
    }).join('');

    message.textContent = 'Kuota ditampilkan berdasarkan data terbaru dari server.';
  } catch (error) {
    grid.innerHTML = `
      <article class="ticket-card">
        <h2>Tiket belum dapat dimuat</h2>
        <p>Periksa koneksi internet atau coba lagi beberapa saat.</p>
        <button class="btn" onclick="loadTickets()">Coba Lagi</button>
      </article>`;
    message.textContent = error.message;
  }
}

loadTickets();
</script>
</body>
</html>
