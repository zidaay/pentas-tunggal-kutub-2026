
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pentas Tunggal KUTUB 2026</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{min-height:100vh;padding:24px 14px}
    .content{max-width:1000px;margin:auto;text-align:center}
    h1{color:#53161f}
    .ticket-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:28px 0}
    .ticket-card{padding:24px;border-radius:18px;background:#ffffffed;box-shadow:0 8px 24px #321c2418}
    .ticket-card h2{color:#53161f}
    .price{font-size:23px;font-weight:bold;color:#53161f}
    .btn{display:inline-block;padding:12px 20px;background:#53161f;color:white;text-decoration:none;border-radius:10px}
    .muted{color:#776970}
  </style>
</head>
<body class="bg-home">
  <main class="content">
    <h1>Pentas Tunggal KUTUB 2026</h1>
    <p>Pilih jenis tiket yang tersedia dan amankan tiketmu sekarang.</p>
    <h2>Jenis Tiket</h2>
    <div class="ticket-grid" id="ticketGrid">
      <p class="muted">Memuat jenis tiket...</p>
    </div>
    <p id="ticketMessage" class="muted"></p>
  </main>

<script>
const API='https://script.google.com/macros/s/AKfycbzSA37cDKyVluKWG-rbzTR5IkfhLDfTLAkxCO_2KvX31vS7g1QUTZVu_EIiGzW37tLT/exec';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v)||0);}
async function loadTicketTypes(){
  const grid=document.getElementById('ticketGrid');
  try{
    const response=await fetch(API+'?action=getTicketTypes');
    const result=await response.json();
    if(!result.success)throw new Error(result.error||'Gagal memuat tiket.');
    const types=result.ticketTypes||[];
    if(!types.length){
      grid.innerHTML='<p class="muted">Belum ada jenis tiket yang dijual. Silakan cek kembali nanti.</p>';
      return;
    }
    grid.innerHTML=types.map(t=>`
      <article class="ticket-card">
        <h2>${esc(t.nama)}</h2>
        <p class="price">${money(t.harga)}</p>
        <a class="btn" href="pesan.html?jenis=${encodeURIComponent(t.nama)}">Pesan Tiket</a>
      </article>`).join('');
  }catch(error){
    grid.innerHTML='<p class="muted">Jenis tiket belum bisa dimuat. Silakan coba lagi.</p>';
    document.getElementById('ticketMessage').textContent=error.message;
  }
}
loadTicketTypes();
</script>
</body>
</html>
